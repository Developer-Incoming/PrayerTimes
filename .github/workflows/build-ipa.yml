name: Build Sideloadable IPA

# This workflow builds a ready-to-sideload .ipa file for iPhone and iPad.
# NO Apple Developer Account, certificates, or provisioning profiles are required!
# You can install the generated .ipa using AltStore, SideStore, Sideloadly, TrollStore, etc.

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build IPA for Sideloading
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Run Unit Tests
        run: |
          swift test --package-path Packages/PrayerKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App Bundle for iOS & iPadOS
        run: |
          echo "Building application for generic iOS device (iPhone & iPad)..."
          xcodebuild build \
            -project PrayerTimes.xcodeproj \
            -scheme PrayerTimes \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="1.0.0" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into Sideloadable .ipa
        run: |
          APP_PATH="derived_data/Build/Products/Release-iphoneos/Prayer Times.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App bundle not found at $APP_PATH"
            # Fallback search if name differs
            APP_PATH=$(find derived_data/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          fi

          echo "Found app bundle at: $APP_PATH"

          # Create Payload directory structure required for IPA
          mkdir -p ipa_packaging/Payload
          cp -R "$APP_PATH" ipa_packaging/Payload/

          # Apply ad-hoc signature (compatible with TrollStore, Sideloadly, AltStore, SideStore)
          echo "Applying ad-hoc code signature..."
          if [ -d "ipa_packaging/Payload/Prayer Times.app/PlugIns/PrayerTimesWidget.appex" ]; then
            codesign --force --deep --sign - "ipa_packaging/Payload/Prayer Times.app/PlugIns/PrayerTimesWidget.appex"
          fi
          codesign --force --deep --sign - "ipa_packaging/Payload/Prayer Times.app"

          # Zip into .ipa
          cd ipa_packaging
          zip -qr ../PrayerTimes.ipa Payload
          cd ..

          echo "✅ Successfully packaged PrayerTimes.ipa!"
          ls -lh PrayerTimes.ipa

      - name: Upload Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerTimes-Sideloadable-IPA
          path: PrayerTimes.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PrayerTimes.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
