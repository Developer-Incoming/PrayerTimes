name: PrayerTimes
options:
  bundleIdPrefix: com.antigravity
  createIntermediateGroups: true
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"

packages:
  PrayerKit:
    path: Packages/PrayerKit

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    APP_GROUP_ID: "group.com.antigravity.PrayerTimes"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  PrayerTimes:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrayerTimes
    dependencies:
      - package: PrayerKit
      - target: PrayerTimesWidget
    info:
      path: PrayerTimes/Info.plist
      properties:
        CFBundleDisplayName: "Prayer Times"
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        NSLocationWhenInUseUsageDescription: "Your location is used to calculate accurate prayer times for your current city."
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).refresh"
        UIBackgroundModes:
          - fetch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: PrayerTimes/PrayerTimes.entitlements
    settings:
      base:
        PRODUCT_NAME: "Prayer Times"
        PRODUCT_BUNDLE_IDENTIFIER: "com.antigravity.PrayerTimes"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"

  PrayerTimesWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PrayerTimesWidget
    dependencies:
      - package: PrayerKit
    info:
      path: PrayerTimesWidget/Info.plist
      properties:
        CFBundleDisplayName: "Prayer Times Widget"
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    entitlements:
      path: PrayerTimesWidget/PrayerTimesWidget.entitlements
    settings:
      base:
        PRODUCT_NAME: "PrayerTimesWidget"
        PRODUCT_BUNDLE_IDENTIFIER: "com.antigravity.PrayerTimes.PrayerTimesWidget"
        GENERATE_INFOPLIST_FILE: "NO"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
